# Egységes heti karbantartás (scripts/app-maintenance/dependabot_gen.py generálja)
version: 2
updates:
  - package-ecosystem: docker
    directories: ["/"]
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directories: ["/"]
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
